<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kpemu Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--text:#0d0d0d;--muted:#6e6e6e;--border:#e8e8e8;--pill:#f3f3f3;--pillon:#fff;--icon:#efeaff;--fg:#6c3cff;--btn:#fff;--track:#f1f1f1;--ok:#16a34a;--warn:#c2740c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--text:#f2f2f2;--muted:#9a9a9a;--border:#2c2c2c;--pill:#222;--pillon:#3a3a3a;--icon:#2a2150;--fg:#9a7dff;--btn:#1c1c1c;--track:#262626;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--text:#f2f2f2;--muted:#9a9a9a;--border:#2c2c2c;--pill:#222;--pillon:#3a3a3a;--icon:#2a2150;--fg:#9a7dff;--btn:#1c1c1c;--track:#262626;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.hb{border:0;background:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.hb:hover{background:var(--pill)}.hb svg{width:20px;height:20px}
header b{font-weight:600;font-size:16px}header span{color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;bottom:0;left:0;width:270px;max-width:82vw;background:var(--bg);border-right:1px solid var(--border);z-index:21;transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
aside.on{transform:none}
.brand{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 18px;font-weight:600;font-size:17px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500;font-size:15px}
.nav a:hover{background:var(--pill)}.nav a.on{background:var(--pill);color:var(--text);font-weight:600}
.nav small{margin-left:auto;font-size:13px}
.who{margin-top:auto;padding:10px;border-top:1px solid var(--border);color:var(--muted);font-size:14px}
main{max-width:720px;margin:0 auto;padding:28px 20px 70px}
h1{margin:0 0 6px;font-size:28px;font-weight:500;letter-spacing:-.01em}
h2{margin:0;font-size:17px;font-weight:600}
.lead{margin:0 0 22px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--border);border-radius:6px;background:var(--btn);font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--pill)}.btn.p{background:var(--text);color:var(--bg);border-color:var(--text)}.btn.d{color:#d6336c}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.back{color:var(--muted);cursor:pointer;display:inline-block;margin-bottom:10px;font-size:14px}
.chip{display:inline-block;font-size:13px;padding:1px 8px;border-radius:99px;background:var(--pill);color:var(--muted)}
.chip.pub{background:#dcf5e5;color:#12803d}.chip.dr{background:#fdf0d5;color:var(--warn)}
@media (prefers-color-scheme:dark){.chip.pub{background:#16301f;color:#5fd68a}.chip.dr{background:#3a2c10;color:#f0b25a}}
.banner{position:relative;height:140px;border-radius:12px;overflow:hidden;color:#fff;margin-bottom:26px}
.track{display:flex;height:100%;transition:transform .6s cubic-bezier(.65,0,.35,1)}
.ad{flex:0 0 100%;padding:30px 24px 0}
.ad.a1{background:radial-gradient(circle at 88% 20%,rgba(255,255,255,.14) 0 44px,transparent 45px),linear-gradient(130deg,#6c3cff,#2d1b6e)}
.ad.a2{background:radial-gradient(circle at 82% 88%,rgba(255,255,255,.14) 0 50px,transparent 51px),linear-gradient(130deg,#0f6b34,#08331a)}
.ad.a3{background:radial-gradient(circle at 90% 15%,rgba(255,255,255,.18) 0 36px,transparent 37px),linear-gradient(130deg,#d9822b,#7a3a0c)}
.banner h3{margin:0 0 4px;font-size:17px;font-weight:600}.banner p{margin:0 0 12px;max-width:64%;font-size:13px;color:rgba(255,255,255,.8)}
.banner .try{background:#fff;color:#111;border:0;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15)}.prog i{display:block;height:100%;background:rgba(255,255,255,.85);transform:scaleX(0);transform-origin:left;animation:pg 5s linear forwards}
@keyframes pg{to{transform:scaleX(1)}}
.grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:40px}
.cell{padding:16px 14px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:108px}
.cell:nth-child(2n){border-right:0}.cell:nth-last-child(-n+2){border-bottom:0}
.lbl{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;cursor:default}
.lbl.go{cursor:pointer}.lbl.go:hover{color:var(--text)}
.val{margin:6px 0 10px;font-size:17px;font-weight:600}
.chart{display:block;width:100%;height:36px}
.mr{margin:10px 0 4px;display:flex;justify-content:space-between;font-size:13px}.mr span:first-child{color:var(--muted)}
.meter{height:8px;border-radius:2px;background:var(--track);overflow:hidden}.meter i{display:block;height:100%;background:var(--ok)}
.sec{margin-bottom:40px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.card{display:flex;flex-direction:column;min-height:112px;padding:16px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:var(--bg);text-align:left;transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card.dark{border-color:#2d1b6e;color:#fff;background:linear-gradient(130deg,#6c3cff,#2d1b6e)}.card.dark .d{color:rgba(255,255,255,.78)}
.ci{width:32px;height:32px;border-radius:8px;background:var(--pill);display:grid;place-items:center;margin-bottom:10px}.card.dark .ci{background:rgba(255,255,255,.16)}
.card b{font-size:14px;font-weight:600}.card .d{font-size:13px;color:var(--muted)}
.item{display:flex;gap:14px;margin-bottom:22px}
.ico{flex:none;width:30px;height:30px;border-radius:50%;background:var(--icon);color:var(--fg);display:grid;place-items:center}.ico svg{width:15px;height:15px}
.item small{display:block;font-size:13px;color:var(--muted)}.item b{display:block;font-size:13.5px;font-weight:600;margin:2px 0}.item p{margin:0;font-size:13.5px;color:var(--muted)}
.tools{display:flex;gap:10px;margin:20px 0 18px;flex-wrap:wrap;align-items:center}.sbox{position:relative;flex:1 1 240px;max-width:380px}.sbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px;pointer-events:none}.sbox input{padding-left:42px;padding-right:38px;border-radius:99px;background:var(--pill);border-color:transparent}.sbox input:focus{background:var(--bg);border-color:var(--fg)}.sx{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;border-radius:50%;background:var(--border);color:var(--text);cursor:pointer;font-size:12px;line-height:1;padding:0}.tools select{width:auto;max-width:200px;border-radius:99px;background:var(--pill);border-color:transparent}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:15px}
.list{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:26px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}.li:last-child{border:0}
.li.click{cursor:pointer}.li.click:hover{background:var(--pill)}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}.li .t span{color:var(--muted);font-size:14px}
.tile{width:36px;height:36px;border-radius:8px;color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;flex:none;text-align:center;line-height:1.1}
.num{width:20px;color:var(--muted);text-align:center;flex:none}
.mini{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.mini button{border:1px solid var(--border);background:var(--btn);border-radius:6px;min-width:28px;height:28px;padding:0 8px;font-size:14px;cursor:pointer}
.mini button:disabled{opacity:.35;cursor:default}
.empty{border:1px dashed var(--border);border-radius:12px;padding:22px;text-align:center;color:var(--muted);margin-bottom:26px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:40;overflow:auto}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:420px;max-height:100%;overflow:auto}
.modal h2{margin-bottom:6px}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 4px;color:var(--muted)}
.sw{display:flex;gap:8px}.sw i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;outline:1px solid var(--border)}.sw i.on{border-color:var(--bg);outline:2px solid var(--text)}
.drop{border:1px dashed var(--border);border-radius:8px;padding:14px;text-align:center;color:var(--muted);cursor:pointer}
.phone{width:290px;max-width:100%;margin:12px auto 0;border:7px solid #1c1a2e;border-radius:30px;background:#f7f7fb;color:#16132b;max-height:62vh;overflow:auto}
.phone .ph{padding:20px 16px;color:#fff;background:linear-gradient(145deg,#6c3cff,#2d1b6e)}.phone .ph h3{margin:0;font-size:24px}
.phone .pb{padding:12px 16px}.phone .pi{padding:8px 0;border-bottom:1px solid #e5e3f0;font-size:12px}.phone .pi span{display:block;color:#6b6885;font-size:11px}
.pc{display:inline-block;width:110px;margin-right:10px;vertical-align:top;font-size:12px;white-space:normal}.pc div{height:76px;border-radius:12px;color:#fff;font-weight:700;padding:8px;display:flex;align-items:flex-end;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:50;font-weight:500}
.form{max-width:520px}.form .row{margin-top:22px}.cover{position:relative;aspect-ratio:16/7;border:1px dashed var(--border);border-radius:12px;overflow:hidden;display:grid;place-items:center;color:var(--muted);cursor:pointer;background:var(--pill);text-align:center;padding:10px}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover svg{width:22px;height:22px;margin:0 auto 6px;display:block}.cvact{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}.phero{height:150px;border-radius:12px;background-size:cover;background-position:center;margin-bottom:16px}.thumb{width:36px;height:36px;border-radius:8px;background-size:cover;background-position:center;flex:none}
.sgrid,.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:26px}.scard{display:flex;flex-direction:column;min-height:120px;padding:16px;border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:transform .2s}.scard:hover,.ccard:hover{transform:translateY(-2px)}.scard b{font-weight:600;font-size:15px}.scard .d{color:var(--muted);font-size:14px}.sarr{margin-top:auto;padding-top:10px;justify-content:flex-start}.ccard{border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .2s}.cban{height:84px;color:#fff;font-weight:600;font-size:18px;padding:10px 14px;display:flex;align-items:flex-end}.cbody{padding:12px 14px;flex:1}.cbody b{display:block;font-weight:600}.cbody span{color:var(--muted);font-size:14px}.cact{padding:0 14px 12px;justify-content:flex-start}
.clist{margin:0 0 26px}.crow{display:flex;align-items:center;gap:14px;padding:16px 2px}.cn{width:26px;text-align:center;color:var(--muted);font-weight:600;font-size:17px;flex:none}.ct{flex:1;min-width:0}.ct b{display:block;font-size:17px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}.ct span{color:var(--muted);font-size:14.5px}.cc{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:none;display:grid;place-items:center;cursor:pointer;flex:none;color:#fff;padding:0}.cc.on{background:var(--ok);border-color:var(--ok)}.cc svg{width:14px;height:14px;stroke-width:2.4}.cm{border:0;background:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}.cm:hover{background:var(--pill)}.menu{display:flex;flex-direction:column;gap:4px;margin-top:10px}.menu button{border:0;background:none;text-align:left;padding:10px 8px;border-radius:8px;cursor:pointer;font-size:15px}.menu button:hover:not(:disabled){background:var(--pill)}.menu button:disabled{opacity:.35;cursor:default}.menu .d{color:#d6336c}
.ccd{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}.cth{position:relative;flex:none}.th{width:92px;height:62px;border-radius:9px;background:var(--pill) center/cover no-repeat;display:grid;place-items:center;color:var(--fg)}.th .tic{width:26px;height:26px}.cnb{position:absolute;top:4px;left:4px;background:var(--text);color:var(--bg);border-radius:6px;font-size:12px;font-weight:600;padding:0 5px;line-height:16px}.cct{flex:1;min-width:0}.cct b{display:block;font-size:17px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}.cct span{display:block;margin-top:3px;font-size:14px;color:var(--muted)}.cct em{font-style:normal;font-weight:600;color:var(--fg)}@media (max-width:420px){.th{width:76px;height:54px}}
.dover{outline:2px dashed var(--fg);outline-offset:2px}[draggable="true"]{cursor:grab}.ccd .rb{border:1px solid var(--border);background:var(--btn);color:var(--text);width:30px;height:30px;border-radius:8px;cursor:pointer}.ccd .rb:disabled{opacity:.35;cursor:default}
@media (max-width:480px){.cards,.grid{grid-template-columns:1fr}.cell{border-right:0!important;border-bottom:1px solid var(--border)!important}.cell:last-child{border-bottom:0!important}.banner p{max-width:90%}}
@media (prefers-reduced-motion:reduce){.track,aside,.scrim,.card{transition:none}.prog{display:none}}
</style>
</head>
<body>
<header><button class="hb" id="hb" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><b>Kpemu</b><span id="ttl"></span></header>
<div class="scrim" id="scrim"></div>
<aside id="side" aria-label="Main menu">
<div class="brand">Kpemu admin<button class="hb" id="hx" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<nav class="nav" id="nav"></nav>
<div class="who">Signed in as Admin</div>

<main id="app"></main>
<script>
var G=["linear-gradient(145deg,#ff6b52,#8a2c20)","linear-gradient(145deg,#6c3cff,#2d1b6e)","linear-gradient(145deg,#14b8a0,#0b6b60)","linear-gradient(145deg,#4a8af0,#2652b5)","linear-gradient(145deg,#ee4a73,#a11d45)","linear-gradient(145deg,#f0894a,#c0501a)"];
var TY={pdf:"PDF",video:"Video",audio:"Audio",note:"Note",link:"Link",slides:"Slides"};
var IC={home:"M3 11l9-8 9 8M5 10v10h14V10",prog:"M12 3 2 8l10 5 10-5-10-5zM6 10.5V16c0 1.5 3 3 6 3s6-1.500 6-3v-5.500",course:"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5M9 7h6",content:"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5",plus:"M12 5v14M5 12h14",search:"M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3",info:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5M12 8h.01"};
var ic=function(k){return '<svg viewBox="0 0 24 24"><path d="'+IC[k]+'"/></svg>'};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var S={programs:[{id:"p1",name:"Pharm.D",code:"PHARMD",desc:"Doctor of Pharmacy",duration:"6 years",status:"published",years:["First Year","Second Year"]}],
courses:[{id:"c1",pid:"p1",code:"BIO 111",title:"General Biology",year:"First Year",inst:"Akoro",color:0,status:"published"},{id:"c2",pid:"p1",code:"BIO 121",title:"Biology II",year:"First Year",inst:"Akoro",color:1,status:"published"},{id:"c3",pid:"p1",code:"CSC 111",title:"Introduction to Computing",year:"First Year",inst:"Akoro",color:3,status:"draft"}],
items:[{id:"i1",cid:"c1",title:"Cell Structure and Organization",type:"pdf",meta:"1.6 MB",status:"published"},{id:"i2",cid:"c1",title:"Characteristics and Classification of Living Things",type:"pdf",meta:"1.2 MB",status:"published"},{id:"i3",cid:"c1",title:"Introduction to Cell Biology",type:"video",meta:"18 min",status:"published"},{id:"i4",cid:"c1",title:"Cell Biology Revision",type:"audio",meta:"12 min",status:"draft"}],
log:[{t:"2 days ago",h:"Program published",p:"Pharm.D is live in the student app."},{t:"last week",h:"Course added",p:"BIO 111 was added to Pharm.D, First Year."}]};
var V={pg:"home",pid:null,cid:null,q:"",f:"",ty:""};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function save(){try{localStorage.setItem("kpemu-admin",JSON.stringify(S))}catch(e){}}
try{var raw=localStorage.getItem("kpemu-admin");if(raw){var pp=JSON.parse(raw);if(pp&&pp.programs)S=pp}}catch(e){}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1800)}
function log(h,p){S.log.unshift({t:"Just now",h:h,p:p});S.log=S.log.slice(0,6)}
var prog=function(id){return S.programs.find(function(x){return x.id===id})};
var crs=function(id){return S.courses.find(function(x){return x.id===id})};
var cnt=function(cid){return S.items.filter(function(i){return i.cid===cid}).length};
var chip=function(s){return '<span class="chip '+(s==="published"?"pub":s==="draft"?"dr":"")+'">'+s+'</span>'};
var tile=function(c){return '<div class="tile" style="background:'+G[c.color]+'">'+esc(c.code)+'</div>'};
var tab=function(t){return '<div class="tile" style="background:var(--icon);color:var(--fg)">'+TY[t]+'</div>'};

var NAV=[["home","Home","home"],["programs","Programs","prog"],["courses","Courses","course"],["contents","Contents","content"]];
function side(on){$("#side").classList.toggle("on",on);$("#scrim").classList.toggle("on",on)}
$("#hb").onclick=function(){side(true)};$("#hx").onclick=$("#scrim").onclick=function(){side(false)};
document.addEventListener("keydown",function(e){if(e.key==="Escape")side(false)});

var slide=0,timer;
function startBanner(){clearInterval(timer);var tr=$("#track");if(!tr)return;timer=setInterval(function(){if(!$("#track"))return clearInterval(timer);slide=(slide+1)%3;tr.style.transform="translateX(-"+slide*100+"%)";$("#bn").textContent=slide+1+" of 3";var pi=$("#pi");pi.style.animation="none";pi.offsetWidth;pi.style.animation=""},5000)}

function home(){
 var pubI=S.items.filter(function(i){return i.status==="published"}).length,dr=S.items.length-pubI;
 var h='<h1>Home</h1><p class="lead">Build programs, courses and learning content for the Kpemu student app.</p>';
 h+='<div class="banner"><div class="track" id="track"><div class="ad a1"><h3>Create once, publish everywhere</h3><p>Programs, courses and materials you publish appear in the student app automatically.</p><button class="try" data-a="newProg">Create a program</button></div><div class="ad a2"><h3>Add content to your courses</h3><p>Upload PDFs, videos, audio lessons and notes, then arrange them in order.</p><button class="try" data-go="contents">Open contents</button></div><div class="ad a3"><h3>Preview before you publish</h3><p>Use Preview on any program or course to see what students will see.</p><button class="try" data-go="programs">View programs</button></div></div><div class="prog"><i id="pi"></i></div></div>';
