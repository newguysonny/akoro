# Frontend gate — drive the learner app in a real browser (phone + desktop)
# as a seeded test learner and fail unless every scenario PASSes.
# akoro-learner/ui-gate/README.md. Manual for now, like verify-gate.yml.
#
# Settings: AKORO_GATE_URL (the API, e.g. https://api.akoro.name.ng) is
# shared with the API gate; AKORO_APP_URL (the deployed learner app, e.g.
# https://akoro.name.ng) is needed for target=live. Optional secret
# UI_GATE_PASSWORD (the test learners' password; defaults to the seed's).
name: Frontend Gate

on:
  workflow_dispatch:
    inputs:
      target:
        description: "live (the deployed app) or local (this commit, built here, against the live API)"
        default: "live"
      suite:
        description: "Suite: all, reader, auth"
        default: "all"
      device:
        description: "phone, desktop or phone,desktop"
        default: "phone,desktop"
      learner:
        description: "Test learner (tester01–tester50)"
        default: "tester17"

jobs:
  ui-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: akoro-learner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: akoro-learner/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the frontend gate
        env:
          UI_GATE_API: ${{ secrets.AKORO_GATE_URL }}
          UI_GATE_APP: ${{ inputs.target == 'live' && vars.AKORO_APP_URL || '' }}
          UI_GATE_PASSWORD: ${{ secrets.UI_GATE_PASSWORD }}
        run: node ui-gate/run.mjs --target "${{ inputs.target }}" --suite "${{ inputs.suite }}" --device "${{ inputs.device }}" --learner "${{ inputs.learner }}"
      - name: Keep the evidence (screenshots, video, report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gate-evidence
          path: akoro-learner/ui-gate/.out
          retention-days: 14
