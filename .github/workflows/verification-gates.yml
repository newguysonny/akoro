# Verification Gates — the API's Verification Gate (akoro-api/modules/verify)
# and the learner app's frontend gate (akoro-learner/ui-gate), on deploy and
# by hand. Only PASS is green.
#
# On a push: wait until the API (and its sandbox, when gate runs go there)
# reports the pushed commit, then run the backend gate, then the frontend
# gate — one after the other, never two gate runs at once (concurrent runs
# trip writes.no_residue). The frontend gate builds THIS commit's learner
# app and drives it against the live API. A commit that never deploys
# (another branch) is noted and skipped, not failed.
#
# By hand: Actions → Verification Gates → Run workflow, with the gate(s),
# suites and targets below. target=live runs the frontend gate on the
# deployed app (vars.AKORO_APP_URL).
#
# One-time setup (Settings → Secrets and variables → Actions):
#   secret   AKORO_GATE_URL    the API, e.g. https://api.akoro.ng
#   secret   AKORO_GATE_KEY    the API's AGENT_CONSOLE_KEY
#   variable AKORO_APP_URL     the deployed learner app, e.g. https://akoro.name.ng
#   secret   UI_GATE_PASSWORD  optional — the test learners' password if it
#                              was changed from the seed's
#   secret   AKORO_EDGE_HEADER optional — "Name: value", a header Cloudflare
#                              lets through. GitHub's runners are datacenter
#                              IPs, which Cloudflare's bot protection refuses
#                              (403 before the API). Make a long random value,
#                              e.g. "X-Akoro-Gate: <random>", and in Cloudflare →
#                              Security → WAF → Custom rules add a rule
#                              (any(http.request.headers["x-akoro-gate"][*] eq "<random>"))
#                              with action Skip (all remaining custom rules,
#                              rate limiting, managed rules, Browser Integrity
#                              Check, Security Level). Bot Fight Mode can't be
#                              skipped by a rule on the free plan — turn it off,
#                              or use Super Bot Fight Mode's verified-bot setting.
name: Verification Gates

on:
  push:
    # main only (2026-10-20): every arena push ran ~30 min of Actions while the gates ran from the session anyway.
    branches: [main]
    paths: ["akoro-api/**", "akoro-learner/**", ".github/workflows/verification-gates.yml", ".github/scripts/gate-*.sh"]
  workflow_dispatch:
    inputs:
      gates:
        description: "Which gates: both, backend, frontend"
        default: "both"
      backend_suite:
        description: "Backend suite (regression, smoke, agent-chat, writes, study-prep, teaching, decay, suggestions, …)"
        default: "regression"
      backend_target:
        description: "Backend: default (the sandbox when it's on) or production"
        default: "default"
      frontend_suite:
        description: "Frontend suite: all, reader, auth"
        default: "all"
      frontend_target:
        description: "Frontend: local (build this commit, live API) or live (the deployed app)"
        default: "local"
      device:
        description: "phone, desktop or phone,desktop"
        default: "phone,desktop"
      learner:
        description: "Frontend test learner (tester01–tester50)"
        default: "tester17"
      expect_sha:
        description: "Commit the server must be running (blank: this run's commit on push, unchecked by hand)"
        default: ""

concurrency:
  group: verification-gates
  cancel-in-progress: false

jobs:
  deploy:
    name: Wait for the deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deployed: ${{ steps.wait.outputs.deployed || 'true' }}
      api_changed: ${{ steps.changes.outputs.api }}
      gates_changed: ${{ steps.changes.outputs.gates }}
      learner_changed: ${{ steps.changes.outputs.learner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "api=true" >> "$GITHUB_OUTPUT"; echo "learner=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          before="${{ github.event.before }}"
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then before="${{ github.sha }}~1"; fi
          files=$(git diff --name-only "$before" "${{ github.sha }}")
          # api: the API itself changed (it redeploys; wait for it). gates: the
          # gates changed (run both against what is live, no wait).
          echo "$files" | grep -qE '^akoro-api/' && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE '^\.github/' && echo "gates=true" >> "$GITHUB_OUTPUT" || echo "gates=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE '^(akoro-learner/|akoro-api/|\.github/)' && echo "learner=true" >> "$GITHUB_OUTPUT" || echo "learner=false" >> "$GITHUB_OUTPUT"
      # Only an API change redeploys the API; a learner-only push runs against
      # the API already live.
      - name: Wait until the API runs this commit
        id: wait
        if: github.event_name == 'push' && steps.changes.outputs.api == 'true'
        env:
          GATE_URL: ${{ secrets.AKORO_GATE_URL }}
          GATE_KEY: ${{ secrets.AKORO_GATE_KEY }}
          EDGE_HEADER: ${{ secrets.AKORO_EDGE_HEADER }}
          SHA: ${{ github.sha }}
          WAIT_MIN: "25"
        run: bash .github/scripts/gate-wait-deploy.sh

  backend:
    name: Backend gate
    needs: deploy
    if: >-
      needs.deploy.outputs.deployed == 'true' &&
      ((github.event_name == 'push' && (needs.deploy.outputs.api_changed == 'true' || needs.deploy.outputs.gates_changed == 'true')) ||
       (github.event_name == 'workflow_dispatch' && inputs.gates != 'frontend'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run the backend gate
        env:
          GATE_URL: ${{ secrets.AKORO_GATE_URL }}
          GATE_KEY: ${{ secrets.AKORO_GATE_KEY }}
          EDGE_HEADER: ${{ secrets.AKORO_EDGE_HEADER }}
          SUITE: ${{ inputs.backend_suite || 'regression' }}
          TARGET: ${{ inputs.backend_target || 'default' }}
          # Pinned to the pushed commit only when the API itself changed (and redeployed).
          EXPECT_SHA: ${{ github.event_name == 'push' && needs.deploy.outputs.api_changed == 'true' && github.sha || inputs.expect_sha }}
        run: bash .github/scripts/gate-backend.sh

  frontend:
    name: Frontend gate
    needs: [deploy, backend]
    # After the backend gate (pass or fail — its verdict is its own job's), never beside it.
    if: >-
      always() && needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true' &&
      ((github.event_name == 'push' && needs.deploy.outputs.learner_changed == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.gates != 'backend'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: akoro-learner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: akoro-learner/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the frontend gate
        env:
          UI_GATE_API: ${{ secrets.AKORO_GATE_URL }}
          UI_GATE_APP: ${{ (inputs.frontend_target || 'local') == 'live' && vars.AKORO_APP_URL || '' }}
          UI_GATE_ORIGIN: ${{ vars.AKORO_APP_URL || 'https://akoro.name.ng' }}
          UI_GATE_PASSWORD: ${{ secrets.UI_GATE_PASSWORD }}
          UI_GATE_EDGE_HEADER: ${{ secrets.AKORO_EDGE_HEADER }}
        run: >-
          node ui-gate/run.mjs
          --target "${{ inputs.frontend_target || 'local' }}"
          --suite "${{ inputs.frontend_suite || 'all' }}"
          --device "${{ inputs.device || 'phone,desktop' }}"
          --learner "${{ inputs.learner || 'tester17' }}"
      - name: Keep the evidence (screenshots, video, report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-gate-evidence
          path: akoro-learner/ui-gate/.out
          include-hidden-files: true
          retention-days: 14
