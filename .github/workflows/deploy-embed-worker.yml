# Build + deploy the RunPod EMBEDDING worker (Qwen/Qwen3-Embedding-0.6B) —
# ONLY when embed-worker/** changes. Same pattern as deploy-runpod-worker.yml
# (the parse worker): contract tests → build (repo-root context) → push
# ghcr.io/<owner>/akoro-embed-worker:<sha> → point its RunPod template at it.
# A separate endpoint from the parse worker: one cached model per endpoint,
# a small GPU instead of a 24 GB card, and one worker kept warm for searches.
#
# One-time setup:
#   1. RunPod console → Serverless → New Endpoint:
#        - Container image: ghcr.io/<owner>/akoro-embed-worker:latest
#        - Model field: Qwen/Qwen3-Embedding-0.6B (cached, unbilled pull)
#        - GPU: the smallest available (16 GB is plenty; the model is ~1.2 GB)
#        - Active workers: 1 (searches embed every question — no cold starts)
#        - Max workers: 2–3
#   2. GHCR visibility: make the akoro-embed-worker package Public, or add
#      GHCR credentials to RunPod (as for the parse worker).
#   3. Repo Settings → Secrets → Actions:
#        RUNPOD_API_KEY            — already set for the parse worker
#        RUNPOD_EMBED_TEMPLATE_ID  — this endpoint's template id
#   4. API (Render env): EMBEDDINGS_PROVIDER=runpod,
#      RUNPOD_EMBED_ENDPOINT_ID=<endpoint id>, RUNPOD_API_KEY=<key>;
#      then re-embed everything once (POST /api/admin/embeddings/reembed-all).
#
# Run manually: Actions tab → "Deploy RunPod embed worker" → Run workflow.

name: Deploy RunPod embed worker

on:
  push:
    branches:
      - arena/e9efe0e4-akoro
    paths:
      - "embed-worker/**"
      - ".github/workflows/deploy-embed-worker.yml"
  workflow_dispatch:

concurrency:
  group: embed-worker-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Embed worker contract tests
        run: node --test embed-worker/test/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # torch + CUDA wheels make a multi-GB image; the default runner is
      # tight on disk, so drop toolchains this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          name="ghcr.io/${owner}/akoro-embed-worker"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${name}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the REPO ROOT: embed-worker/Dockerfile COPYs
      # through the folder (embed-worker/requirements.txt, embedcore.py, handler.py).
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: embed-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

      # Point the endpoint's template at the immutable SHA tag (not :latest),
      # so RunPod rolls workers onto exactly this build and a rollback is just
      # re-running an older commit's workflow.
      - name: Update RunPod template
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_EMBED_TEMPLATE_ID: ${{ secrets.RUNPOD_EMBED_TEMPLATE_ID }}
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          if [ -z "$RUNPOD_API_KEY" ] || [ -z "$RUNPOD_EMBED_TEMPLATE_ID" ]; then
            echo "::warning::RUNPOD_API_KEY / RUNPOD_EMBED_TEMPLATE_ID not set — image pushed, endpoint NOT updated."
            echo "Set the template's container image to: $IMAGE"
            exit 0
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
            "https://rest.runpod.io/v1/templates/${RUNPOD_EMBED_TEMPLATE_ID}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"imageName\": \"${IMAGE}\"}")
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::RunPod template update failed (HTTP $status)"
            cat response.json
            exit 1
          fi
          echo "RunPod template ${RUNPOD_EMBED_TEMPLATE_ID} → ${IMAGE}"

      - name: Summary
        run: |
          echo "### RunPod embed worker deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ steps.image.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
