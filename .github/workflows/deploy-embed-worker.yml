# Build + deploy the RunPod EMBEDDING worker — ONLY when embed-worker/**
# changes. Same pattern as deploy-runpod-worker.yml (the hanji parse worker):
# contract tests → build (repo-root context) → push
# ghcr.io/<owner>/akoro-embed-worker:<sha> → point the RunPod templates at it.
#
# ONE image, ONE endpoint (+ its template) PER MODEL — each endpoint caches
# one model, and the template's EMBED_MODEL_ID tells the worker which it runs:
#   Qwen3   Model field + EMBED_MODEL_ID = Qwen/Qwen3-Embedding-0.6B
#   bge-m3  Model field + EMBED_MODEL_ID = BAAI/bge-m3
# Once one is chosen, delete the other endpoint and its template (and secret).
#
# One-time setup, per model (template first, then the endpoint on it — as
# for the hanji worker):
#   1. RunPod console → Serverless → Templates → New Template:
#        - Name: akoro-embed-qwen3 / akoro-embed-bge-m3
#        - Type: Serverless
#        - Container image: ghcr.io/<owner>/akoro-embed-worker:latest
#        - Container disk: 20 GB
#        - Env: EMBED_MODEL_ID = Qwen/Qwen3-Embedding-0.6B / BAAI/bge-m3
#        - Registry credentials: as on the hanji template, if it has them
#      Its id (Templates list) is the GitHub secret in step 3.
#   1b. Serverless → New Endpoint → pick that template:
#        - Model field: the same model id (cached, unbilled pull)
#        - GPU: the smallest available (16 GB is plenty; each model is ~1-2 GB)
#        - Active workers: 0 (scales to zero; the first search after idle waits
#          for a cold start), Max workers: 1-2, FlashBoot on
#      Its id (endpoint page) goes in the API's env in step 4.
#   2. GHCR: the akoro-embed-worker package Public, or GHCR credentials in RunPod.
#   3. Repo Settings → Secrets → Actions (RUNPOD_API_KEY is already set):
#        RUNPOD_EMBED_TEMPLATE_ID      — the Qwen3 template's id
#        RUNPOD_EMBED_BGE_TEMPLATE_ID  — the bge-m3 template's id
#   4. API (Render env): RUNPOD_EMBED_ENDPOINT_ID (Qwen3),
#      RUNPOD_EMBED_BGE_ENDPOINT_ID (bge-m3), RUNPOD_API_KEY. Compare with
#      POST /api/admin/embeddings/compare (stores untouched); only then
#      EMBEDDINGS_PROVIDER=runpod + EMBEDDINGS_MODEL and a re-embed-all.
#
# Run manually: Actions tab → "Deploy RunPod embed worker" → Run workflow.

name: Deploy RunPod embed worker

on:
  push:
    branches:
      - arena/e9efe0e4-akoro
    paths:
      - "embed-worker/**"
      - ".github/workflows/deploy-embed-worker.yml"
  workflow_dispatch:

concurrency:
  group: embed-worker-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Embed worker contract tests
        run: node --test embed-worker/test/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # torch + CUDA wheels make a multi-GB image; the default runner is
      # tight on disk, so drop toolchains this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          name="ghcr.io/${owner}/akoro-embed-worker"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${name}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the REPO ROOT: embed-worker/Dockerfile COPYs
      # through the folder (embed-worker/requirements.txt, embedcore.py, handler.py).
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: embed-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

      # Point the endpoint's template at the immutable SHA tag (not :latest),
      # so RunPod rolls workers onto exactly this build and a rollback is just
      # re-running an older commit's workflow.
      - name: Update RunPod templates
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          QWEN_TEMPLATE: ${{ secrets.RUNPOD_EMBED_TEMPLATE_ID }}
          BGE_TEMPLATE: ${{ secrets.RUNPOD_EMBED_BGE_TEMPLATE_ID }}
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          if [ -z "$RUNPOD_API_KEY" ] || { [ -z "$QWEN_TEMPLATE" ] && [ -z "$BGE_TEMPLATE" ]; }; then
            echo "::warning::RUNPOD_API_KEY / embed template ids not set — image pushed, endpoints NOT updated."
            echo "Set the templates' container image to: $IMAGE"
            exit 0
          fi
          failed=0
          for pair in "Qwen3:${QWEN_TEMPLATE}" "bge-m3:${BGE_TEMPLATE}"; do
            label="${pair%%:*}"; id="${pair#*:}"
            if [ -z "$id" ]; then echo "$label: no template id set — skipped"; continue; fi
            status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
              "https://rest.runpod.io/v1/templates/${id}" \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"imageName\": \"${IMAGE}\"}")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::$label template update failed (HTTP $status)"; cat response.json; failed=1
            else
              echo "$label template ${id} → ${IMAGE}"
            fi
          done
          exit $failed

      - name: Summary
        run: |
          echo "### RunPod embed worker deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ steps.image.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
