# Build + deploy the RunPod parse worker — ONLY when the worker changes.
#
# Why this exists: the RunPod endpoint used to be wired to this repo through
# RunPod's GitHub integration, which rebuilds on every push/release of the
# branch. This repo is a monorepo, so every unrelated commit (API, learner
# app, docs) rebuilt and redeployed the worker. This workflow replaces that:
# it runs only when runpod-worker/** (or this file) changes, builds the image
# on a GitHub runner, pushes it to GHCR, then points the endpoint's template
# at the new image tag.
#
# One-time setup:
#   1. RunPod console → the endpoint → disconnect the GitHub integration and
#      set it to a container image instead (any tag of the image below).
#   2. GHCR image visibility: GitHub → your profile → Packages →
#      akoro-runpod-worker → Package settings → make it Public, OR add GHCR
#      credentials to RunPod (Settings → Container Registry Auth: user = your
#      GitHub username, password = a PAT with read:packages) and select them
#      on the template.
#   3. Repo Settings → Secrets and variables → Actions:
#        RUNPOD_API_KEY      — RunPod console → Settings → API Keys
#        RUNPOD_TEMPLATE_ID  — the endpoint's template id (Serverless →
#                              endpoint → Manage → Edit endpoint → template)
#      Without these two secrets the workflow still builds and pushes the
#      image and prints the tag; update the endpoint by hand.
#
# Run manually: Actions tab → "Deploy RunPod worker" → Run workflow.
# Verify afterwards: RunPod endpoint → Workers rolls to the new image tag,
# then send test_input.json to /runsync.

name: Deploy RunPod worker

on:
  push:
    branches:
      - arena/e9efe0e4-akoro
    paths:
      - "runpod-worker/**"
      - ".github/workflows/deploy-runpod-worker.yml"
  workflow_dispatch:

concurrency:
  group: runpod-worker-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Worker contract tests
        run: node --test runpod-worker/test/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # torch + CUDA wheels make a multi-GB image; the default runner is
      # tight on disk, so drop toolchains this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          name="ghcr.io/${owner}/akoro-runpod-worker"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${name}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the REPO ROOT: runpod-worker/Dockerfile COPYs
      # through the folder (runpod-worker/requirements.txt, handler.py).
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

      # Point the endpoint's template at the immutable SHA tag (not :latest),
      # so RunPod rolls workers onto exactly this build and a rollback is just
      # re-running an older commit's workflow.
      - name: Update RunPod template
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ secrets.RUNPOD_TEMPLATE_ID }}
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          if [ -z "$RUNPOD_API_KEY" ] || [ -z "$RUNPOD_TEMPLATE_ID" ]; then
            echo "::warning::RUNPOD_API_KEY / RUNPOD_TEMPLATE_ID not set — image pushed, endpoint NOT updated."
            echo "Set the template's container image to: $IMAGE"
            exit 0
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
            "https://rest.runpod.io/v1/templates/${RUNPOD_TEMPLATE_ID}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"imageName\": \"${IMAGE}\"}")
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::RunPod template update failed (HTTP $status)"
            cat response.json
            exit 1
          fi
          echo "RunPod template ${RUNPOD_TEMPLATE_ID} → ${IMAGE}"

      - name: Summary
        run: |
          echo "### RunPod worker deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ steps.image.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
