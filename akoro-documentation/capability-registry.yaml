    requires_confirmation: false
    side_effects: []
    verification:
      - the response includes only records owned by the caller
      - paged responses include records, total and nextCursor
      - production smoke passed on 2026-11-25
      - sandbox smoke passed on 2026-11-25
    verification_status: production-verified
    last_verified: "2026-11-25"

  - id: records.request_upload
    name: Request a library upload URL
    category: records
    status: implemented
    description: >
      Creates a presigned upload URL for a Library file so the browser can send
      bytes directly to object storage.
    documentation:
      - 01-features/records/overview.md
      - 02-api/endpoints/records-upload-url.md
    api_reference:
      - 02-api/openapi.yaml
    access:
      - learner
    requires_confirmation: false
    side_effects:
      - creates a presigned storage URL and key
    verification:
      - the returned key is under the caller's own storage prefix
      - the URL can be used for a single PUT before expiry
      - production smoke passed on 2026-11-25
      - sandbox smoke passed on 2026-11-25
    verification_status: production-verified
    last_verified: "2026-11-25"

  - id: records.create
    name: Create a library record
    category: records
    status: implemented
    description: >
      Registers an uploaded file, a pasted note or a saved link in the
      learner's Library after the upload has landed.
    documentation:
      - 01-features/records/overview.md
      - 02-api/endpoints/records-create.md
      - 13-examples/workflows/records-upload-and-ask.md
    api_reference:
      - 02-api/openapi.yaml
    access:
      - learner
    requires_confirmation: false
    side_effects:
      - creates a Library record
      - may start preview, index, extraction or transcription jobs
    verification:
      - the record appears in GET /api/records
      - fileKey belongs to the caller
      - sandbox smoke passed on 2026-11-25
      - sandbox write-path smoke passed on 2026-11-26 (create, grounded ask, delete, verified gone)
    verification_status: sandbox-verified
    last_verified: "2026-11-26"

  - id: records.ask
