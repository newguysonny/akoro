[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "akoro-agent-from-scratch"
version = "0.1.0"
description = "A small, permissioned, tool-using agent with an OpenAI-compatible LLM client."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.66,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
akoro-agent = "agent.harness.harness:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
