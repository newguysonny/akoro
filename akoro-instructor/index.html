<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E8884A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Akoro Instructor" />
    <link rel="icon" type="image/svg+xml" href="/logo/akoro-mark-transparent.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/akoro-light-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Akoro — Instructor</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; font-family: 'DM Sans', sans-serif; background: #FAF8F5; }
      @keyframes sheet-up   { from { transform: translateY(100%); opacity:0; } to { transform: translateY(0); opacity:1; } }
      @keyframes pulse-dot  { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.5; transform:scale(.85); } }
      @keyframes fade-in    { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
      @keyframes spin       { to { transform: rotate(360deg); } }
      @keyframes fade-up    { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
      @keyframes shimmer    { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
